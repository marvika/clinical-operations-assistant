server {
    listen 3000;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        # SSE: stream straight through, no buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
